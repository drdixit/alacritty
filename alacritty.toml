# [terminal]
# shell = { program = "pwsh.exe", args = ["-NoLogo"] }
# shell = { program = "powershell.exe", args = ["-NoLogo"] }
# shell = { program = "wsl.exe", args = ["-d", "Ubuntu", "--cd", "~"] }

# [general]
# working_directory = "C:\\Users\\user"

[env]
TERM = "xterm-256color"
# NVIM_APPNAME = "windows-nvim-config"
# XDG_CACHE_HOME = "C:\\Users\\user\\.cache"
# XDG_CONFIG_HOME = "C:\\Users\\user\\.config"
# XDG_DATA_HOME = "C:\\Users\\user\\.local\\share"
# XDG_STATE_HOME = "C:\\Users\\user\\.local\\state"
# HOME = "C:\\Users\\user"
# USERPROFILE = "C:\\Users\\user"
# COLORTERM = "truecolor"
# TERM = "alacritty"

[font]
size = 16.0
normal = { family = "IosevkaTerm Nerd Font", style = "Regular" }
bold = { family = "IosevkaTerm Nerd Font", style = "Bold" }
italic = { family = "IosevkaTerm Nerd Font", style = "Italic" }
bold_italic = { family = "IosevkaTerm Nerd Font", style = "Bold Italic" }
# offset = { x = -1, y = 0 }

[window]
# dynamic_title = true
# dynamic_padding = false
dynamic_title = false
title = "Alacritty"
decorations =  "None"
# startup_mode = "Maximized"
padding = { x = 4, y = 4 }
position = { x = 840, y = 0 }
dimensions = { columns = 89 , lines = 38 }

[cursor]
style = { shape = "Block", blinking = "Never" }
# blink_interval = 500
# blink_timeout = 0
unfocused_hollow = true

[keyboard]
bindings = [
  # \u001b[32;5u is the CSI u format/CSI u (fixterms) protocol "I have no idea what this is but now ctrl+space is working inside NeoVim."
{ key = "Space", mods = "Control", chars = "\u001b[32;5u" }
]

# -----------------------------------------------------------------------------
# TokyoNight Night — Customized to match Neovim
# -----------------------------------------------------------------------------

# Primary colors
[colors.primary]
background = "#011628"
foreground = "#CBE0F0"
dim_foreground = "#627E97"
bright_foreground = "#CBE0F0"

# Cursor
[colors.cursor]
text = "#011628"
cursor = "#CBE0F0"

# Vi mode cursor
[colors.vi_mode_cursor]
text = "#011628"
cursor = "#CBE0F0"

# Selection — matches Neovim bg_visual
[colors.selection]
text = "#CBE0F0"
background = "#275378"

# Search — matches Neovim bg_highlight and bg_search
[colors.search.matches]
foreground = "#CBE0F0"
background = "#143652"

[colors.search.focused_match]
foreground = "#CBE0F0"
background = "#0A64AC"

# Footer bar
[colors.footer_bar]
foreground = "#CBE0F0"
background = "#143652"

# History/search position indicator
[colors.line_indicator]
foreground = "#CBE0F0"
background = "#143652"

# Normal colors
[colors.normal]
black = "#011423"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#B4D0E9"

# Bright colors
[colors.bright]
black = "#627E97"
red = "#ff899d"
green = "#9fe044"
yellow = "#faba4a"
blue = "#8db0ff"
magenta = "#c7a9ff"
cyan = "#a4daff"
white = "#CBE0F0"
